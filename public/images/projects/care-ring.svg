<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Central Radar Map Simulation -->
  <circle cx="600" cy="337" r="260" fill="url(#radar)"/>
  <circle cx="600" cy="337" r="260" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="600" cy="337" r="180" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="600" cy="337" r="100" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="600" cy="337" r="8" fill="#06b6d4"/>

  <!-- Top App Bar -->
  <rect x="80" y="60" width="1040" height="60" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <circle cx="120" cy="90" r="14" fill="#06b6d4" fill-opacity="0.2"/>
  <path d="M120 82a6 6 0 0 1 6 6c0 4.5-6 10-6 10s-6-5.5-6-10a6 6 0 0 1 6-6z" fill="#06b6d4"/>
  <text x="145" y="96" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18">CareRing Telemetry Hub</text>
  <rect x="850" y="76" width="120" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <circle cx="865" cy="90" r="4" fill="#10b981"/>
  <text x="876" y="95" fill="#10b981" font-family="monospace" font-size="12" font-weight="600">LIVE WS 42ms</text>
  <rect x="980" y="76" width="120" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="1000" y="95" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="600">GPS: 0.8%/hr</text>

  <!-- Left Telemetry Panel -->
  <rect x="80" y="150" width="300" height="460" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="195" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">ACTIVE FAMILY CIRCLE</text>

  <!-- Member 1: Driving -->
  <rect x="105" y="220" width="250" height="85" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="140" cy="262" r="20" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="140" y="268" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">S</text>
  <text x="175" y="250" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="15">Sunny (Driving)</text>
  <text x="175" y="272" fill="#38bdf8" font-family="monospace" font-size="12">54 km/h • NH-31</text>
  <text x="175" y="290" fill="#64748b" font-family="monospace" font-size="10">Battery 88% • Signal High</text>

  <!-- Member 2: Safe at Home -->
  <rect x="105" y="325" width="250" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="140" cy="367" r="20" fill="#10b981" fill-opacity="0.2"/>
  <text x="140" y="373" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="16">M</text>
  <text x="175" y="355" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="15">Mother</text>
  <text x="175" y="377" fill="#10b981" font-family="monospace" font-size="12">Inside Home Geofence</text>
  <text x="175" y="395" fill="#64748b" font-family="monospace" font-size="10">Stationary • Wi-Fi Mesh</text>

  <!-- Geofence summary -->
  <rect x="105" y="430" width="250" height="150" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
  <text x="125" y="465" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="600">PostGIS SPATIAL FENCES</text>
  <text x="125" y="495" fill="#94a3b8" font-family="sans-serif" font-size="12">✓ Home Safe Zone (500m)</text>
  <text x="125" y="525" fill="#94a3b8" font-family="sans-serif" font-size="12">✓ School / Campus Zone</text>
  <text x="125" y="555" fill="#94a3b8" font-family="sans-serif" font-size="12">✓ Zero-Broker Relay Mode</text>

  <!-- Right SOS Card -->
  <rect x="820" y="150" width="300" height="460" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="850" y="195" fill="#ef4444" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">SAFETY MONITORING</text>

  <rect x="845" y="220" width="250" height="120" rx="14" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="970" cy="265" r="26" fill="#ef4444"/>
  <text x="970" y="271" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12">SOS</text>
  <text x="970" y="315" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-weight="600" font-size="13">One-Touch Alert Active</text>

  <rect x="845" y="360" width="250" height="220" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="865" y="395" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="14">Real-Time Telemetry Stream</text>
  <text x="865" y="425" fill="#64748b" font-family="monospace" font-size="11">LAT: 25.5941° N</text>
  <text x="865" y="450" fill="#64748b" font-family="monospace" font-size="11">LON: 85.1376° E</text>
  <text x="865" y="475" fill="#64748b" font-family="monospace" font-size="11">ACCURACY: ±3.2m</text>
  <text x="865" y="500" fill="#64748b" font-family="monospace" font-size="11">MOTION: PEDESTRIAN_STOP</text>
  <text x="865" y="525" fill="#10b981" font-family="monospace" font-size="11">ENCRYPTION: E2EE AES-GCM</text>
</svg>

