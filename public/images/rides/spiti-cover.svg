<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="spitiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#312E81" />
      <stop offset="85%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <linearGradient id="spitiCliff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="50%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="dirtRoad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- High-Altitude Trans-Himalayan Twilight Sky -->
  <rect width="800" height="450" fill="url(#spitiSky)" />

  <!-- Stars in High Altitude Sky -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="120" cy="50" r="1.5" />
    <circle cx="280" cy="35" r="1.2" />
    <circle cx="450" cy="70" r="1.5" />
    <circle cx="620" cy="40" r="2" />
    <circle cx="710" cy="85" r="1.2" />
    <circle cx="180" cy="110" r="1" />
    <circle cx="530" cy="115" r="1.4" />
  </g>

  <!-- Treacherous Jagged Sach Pass Cliffs -->
  <polygon points="40,260 220,100 380,260" fill="url(#spitiCliff)" />
  <polygon points="280,260 460,70 640,260" fill="url(#spitiCliff)" opacity="0.95" />
  <polygon points="520,260 680,110 840,260" fill="url(#spitiCliff)" opacity="0.9" />

  <!-- Iconic Key Monastery Perched on Mountain Cone -->
  <g transform="translate(390, 160)" fill="#FEF2F2" stroke="#450A0A" stroke-width="1.5">
    <!-- Base White Monastery Walls -->
    <rect x="-30" y="30" width="60" height="25" />
    <rect x="-24" y="15" width="48" height="18" />
    <rect x="-18" y="2" width="36" height="15" />
    <!-- Golden Top Pinnacle -->
    <polygon points="-8,2 8,2 0,-10" fill="#FBBF24" stroke="#B45309" />
    <!-- Red Accent Windows -->
    <rect x="-12" y="7" width="5" height="6" fill="#DC2626" />
    <rect x="7" y="7" width="5" height="6" fill="#DC2626" />
    <rect x="-18" y="20" width="6" height="7" fill="#DC2626" />
    <rect x="12" y="20" width="6" height="7" fill="#DC2626" />
  </g>

  <!-- Narrow Cliffhanger Dirt Track (Spiti River Gorge Road) -->
  <path d="M 0 450 Q 220 410 340 330 Q 420 280 540 310 Q 660 340 800 320 L 800 450 Z" fill="url(#dirtRoad)" />
  <!-- Gravel Texture Lines -->
  <path d="M 0 420 Q 220 385 340 335" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6" />

  <!-- Badge Overlay -->
  <g transform="translate(40, 40)" font-family="monospace">
    <rect width="280" height="52" rx="10" fill="#09090B" fill-opacity="0.85" stroke="#A855F7" stroke-width="1.5" />
    <text x="16" y="22" fill="#C084FC" font-size="11" font-weight="bold">SPITI VALLEY &amp; SACH PASS</text>
    <text x="16" y="38" fill="#E2E8F0" font-size="10">AUTUMN 2025 • 3,200 KM EXPEDITION</text>
  </g>
</svg>

