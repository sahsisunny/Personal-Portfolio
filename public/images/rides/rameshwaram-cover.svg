<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    <linearGradient id="bridgeSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="50%" stop-color="#71717A" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
  </defs>

  <!-- Tropical Coastal Sunset Sky -->
  <rect width="800" height="450" fill="url(#sunsetSky)" />

  <!-- Sun Dipping Into Ocean -->
  <circle cx="500" cy="220" r="48" fill="#FEF08A" opacity="0.9" />

  <!-- Indian Ocean Waters -->
  <rect y="220" width="800" height="230" fill="url(#oceanGrad)" />

  <!-- Distant Ocean Waves -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.4">
    <line x1="0" y1="235" x2="800" y2="235" stroke-dasharray="12 18" />
    <line x1="0" y1="250" x2="800" y2="250" stroke-dasharray="24 16" />
    <line x1="0" y1="270" x2="800" y2="270" stroke-dasharray="30 20" />
  </g>

  <!-- Pamban Sea Bridge Piers in the Water -->
  <g fill="#18181B">
    <rect x="80" y="220" width="22" height="70" rx="3" />
    <rect x="180" y="220" width="22" height="70" rx="3" />
    <rect x="280" y="220" width="22" height="70" rx="3" />
    <rect x="380" y="220" width="22" height="70" rx="3" />
    <rect x="480" y="220" width="22" height="70" rx="3" />
    <rect x="580" y="220" width="22" height="70" rx="3" />
    <rect x="680" y="220" width="22" height="70" rx="3" />
  </g>

  <!-- Cantilever Truss Bridge Steel Structure -->
  <path d="M 0 220 L 800 220" stroke="url(#bridgeSteel)" stroke-width="12" />
  <!-- Bridge Railing -->
  <path d="M 0 212 L 800 212" stroke="#A1A1AA" stroke-width="3" />
  <!-- Diagonal Truss Girders -->
  <g stroke="#52525B" stroke-width="2.5">
    <line x1="80" y1="220" x2="130" y2="185" />
    <line x1="130" y1="185" x2="180" y2="220" />
    <line x1="180" y1="220" x2="230" y2="185" />
    <line x1="230" y1="185" x2="280" y2="220" />
    <line x1="280" y1="220" x2="330" y2="185" />
    <line x1="330" y1="185" x2="380" y2="220" />
    <line x1="380" y1="220" x2="430" y2="185" />
    <line x1="430" y1="185" x2="480" y2="220" />
    <line x1="480" y1="220" x2="530" y2="185" />
    <line x1="530" y1="185" x2="580" y2="220" />
    <line x1="580" y1="220" x2="630" y2="185" />
    <line x1="630" y1="185" x2="680" y2="220" />
    <line x1="80" y1="185" x2="680" y2="185" stroke-width="4" />
  </g>

  <!-- Dhanushkodi Beach Edge & Coastal Road in Foreground -->
  <path d="M 0 450 Q 300 410 460 360 L 800 370 L 800 450 Z" fill="#FDE047" opacity="0.3" />
  <path d="M 0 450 L 320 370 L 800 370 L 800 450 Z" fill="#18181B" />
  <!-- Road White Edge Line -->
  <path d="M 0 435 L 320 375 L 800 375" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 10" />

  <!-- Badge Overlay -->
  <g transform="translate(40, 40)" font-family="monospace">
    <rect width="270" height="52" rx="10" fill="#09090B" fill-opacity="0.85" stroke="#FB923C" stroke-width="1.5" />
    <text x="16" y="22" fill="#FB923C" font-size="11" font-weight="bold">PATNA ➔ RAMESHWARAM</text>
    <text x="16" y="38" fill="#E2E8F0" font-size="10">5,420 KM • PAMBAN SEA BRIDGE & OCEAN</text>
  </g>
</svg>

