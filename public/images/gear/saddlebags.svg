<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tarp-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bag-bg)" rx="16"/>
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" rx="12"/>

  <!-- Technical Labels -->
  <text x="40" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#eab308" letter-spacing="2">EXPEDITION LUGGAGE RIG</text>
  <text x="40" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">55L Heavy-Duty Waterproof Dry Saddlebags</text>

  <!-- Saddlebag Rig Graphic -->
  <g transform="translate(100, 90)">
    <!-- Heavy Duty Bridging Harness Straps (Across Pillion Seat) -->
    <rect x="70" y="70" width="260" height="24" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
    <line x1="120" y1="70" x2="120" y2="94" stroke="#f59e0b" stroke-width="2"/>
    <line x1="280" y1="70" x2="280" y2="94" stroke="#f59e0b" stroke-width="2"/>

    <!-- Left Dry Saddlebag -->
    <g transform="translate(10, 80)">
      <!-- Roll-top closure top -->
      <path d="M 10 20 L 140 20 L 130 0 L 20 0 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
      <!-- Main Dry Bag Body -->
      <rect x="10" y="20" width="130" height="170" rx="12" fill="url(#tarp-grad)" stroke="#475569" stroke-width="2.5"/>
      <!-- Reflective 3M chevron bands -->
      <rect x="20" y="70" width="110" height="10" rx="2" fill="#e2e8f0" opacity="0.85"/>
      <rect x="20" y="110" width="110" height="10" rx="2" fill="#e2e8f0" opacity="0.85"/>
      <!-- Molle web strapping -->
      <line x1="30" y1="140" x2="120" y2="140" stroke="#f59e0b" stroke-width="2.5"/>
      <line x1="30" y1="155" x2="120" y2="155" stroke="#f59e0b" stroke-width="2.5"/>
      <!-- Water bottle / Fuel Canister Pouch -->
      <rect x="0" y="60" width="16" height="80" rx="4" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Quick-release compression buckles -->
      <rect x="35" y="45" width="12" height="20" rx="2" fill="#f59e0b"/>
      <rect x="105" y="45" width="12" height="20" rx="2" fill="#f59e0b"/>
    </g>

    <!-- Right Dry Saddlebag -->
    <g transform="translate(250, 80)">
      <!-- Roll-top closure top -->
      <path d="M 10 20 L 140 20 L 130 0 L 20 0 Z" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
      <!-- Main Dry Bag Body -->
      <rect x="10" y="20" width="130" height="170" rx="12" fill="url(#tarp-grad)" stroke="#475569" stroke-width="2.5"/>
      <!-- Reflective 3M chevron bands -->
      <rect x="20" y="70" width="110" height="10" rx="2" fill="#e2e8f0" opacity="0.85"/>
      <rect x="20" y="110" width="110" height="10" rx="2" fill="#e2e8f0" opacity="0.85"/>
      <!-- Molle web strapping -->
      <line x1="30" y1="140" x2="120" y2="140" stroke="#f59e0b" stroke-width="2.5"/>
      <line x1="30" y1="155" x2="120" y2="155" stroke="#f59e0b" stroke-width="2.5"/>
      <!-- Water bottle / Fuel Canister Pouch -->
      <rect x="134" y="60" width="16" height="80" rx="4" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Quick-release compression buckles -->
      <rect x="35" y="45" width="12" height="20" rx="2" fill="#f59e0b"/>
      <rect x="105" y="45" width="12" height="20" rx="2" fill="#f59e0b"/>
    </g>

    <!-- Central Tail Bag / Duffel Mount -->
    <rect x="150" y="20" width="100" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="200" y="58" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">55L DRY</text>
  </g>

  <!-- Technical Overlay -->
  <g transform="translate(40, 400)" font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="0" y="0">FABRIC: 1000D CORDURA + TPU</text>
    <text x="250" y="0">WATERPROOF: 10,000MM H2O</text>
    <text x="470" y="0">SEAMS: RADIO WELDED</text>
  </g>
</svg>