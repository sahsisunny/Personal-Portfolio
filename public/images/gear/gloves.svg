<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="glove-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="carbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#glove-bg)" rx="16"/>
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" rx="12"/>

  <!-- Technical Labels -->
  <text x="40" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981" letter-spacing="2">HAND & WRIST ARMOUR</text>
  <text x="40" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Viaterra Armored Waterproof Touring Gloves</text>

  <!-- Glove Graphic -->
  <g transform="translate(160, 80)">
    <!-- Gauntlet Cuff -->
    <path d="M 50 250 L 220 250 L 205 180 L 65 180 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Wrist Velcro Cinch -->
    <rect x="60" y="215" width="150" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="135" y="229" font-family="monospace" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">AQUATOUR WP</text>

    <!-- Palm & Main Hand Body -->
    <path d="M 65 180 L 205 180 L 220 110 L 200 40 L 170 30 L 140 30 L 115 35 L 85 45 L 60 90 L 40 120 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>

    <!-- Carbon Fiber Knuckle Protector -->
    <path d="M 75 110 Q 140 95 195 110 L 185 145 Q 135 135 85 145 Z" fill="url(#carbon-grad)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="95" cy="125" r="7" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="123" cy="121" r="7" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="150" cy="121" r="7" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="175" cy="125" r="7" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>

    <!-- Scaphoid Palm Slider (Knox SPS) -->
    <rect x="65" y="185" width="30" height="20" rx="6" fill="#020617" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Fingers with accordion stretch panels -->
    <!-- Pinky -->
    <rect x="75" y="45" width="22" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Ring -->
    <rect x="105" y="32" width="24" height="75" rx="11" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Middle -->
    <rect x="135" y="25" width="25" height="85" rx="11" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Index with Touchscreen conductive fingertip -->
    <rect x="165" y="35" width="25" height="75" rx="11" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="177" cy="42" r="5" fill="#38bdf8"/>

    <!-- Thumb -->
    <path d="M 40 120 L 20 150 C 15 165 30 180 45 170 L 65 140 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Visor Wiper on Left Index Finger -->
    <line x1="190" y1="45" x2="190" y2="85" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Technical Overlay -->
  <g transform="translate(40, 400)" font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="0" y="0">ARMOUR: CARBON KNUCKLE + KNOX SPS</text>
    <text x="260" y="0">TOUCH: CONDUCTIVE INDEX</text>
    <text x="470" y="0">THERMAL: FLEECE LINED</text>
  </g>
</svg>
