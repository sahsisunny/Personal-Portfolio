<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lens-optic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#cam-bg)" rx="16"/>
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" rx="12"/>

  <!-- Technical Labels -->
  <text x="40" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#ec4899" letter-spacing="2">POV CINEMATOGRAPHY RIG</text>
  <text x="40" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">4K 60fps Helmet Action Camera & Mic Rig</text>

  <!-- Action Cam Graphic -->
  <g transform="translate(130, 95)">
    <!-- Rugged Cage / Housing -->
    <rect x="50" y="40" width="240" height="170" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3"/>

    <!-- Front Color Display Screen -->
    <rect x="70" y="65" width="80" height="80" rx="6" fill="#020617" stroke="#334155" stroke-width="2"/>
    <text x="110" y="105" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">4K 60</text>
    <circle cx="82" cy="78" r="4" fill="#ef4444"/>
    <text x="92" y="81" font-family="monospace" font-size="8" font-weight="bold" fill="#ef4444">REC</text>

    <!-- Large Ultra-Wide Lens Assembly -->
    <circle cx="215" cy="115" r="55" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="215" cy="115" r="46" fill="#020617" stroke="#475569" stroke-width="2"/>
    <circle cx="215" cy="115" r="36" fill="url(#lens-optic)"/>
    <!-- Optical Glare / Flare -->
    <ellipse cx="205" cy="100" rx="16" ry="8" fill="#ffffff" opacity="0.35" transform="rotate(-30 205 100)"/>

    <!-- Red Recording LED Indicator -->
    <circle cx="65" cy="55" r="4" fill="#ef4444"/>

    <!-- Shutter Button on Top -->
    <rect x="200" y="28" width="45" height="12" rx="3" fill="#ef4444"/>

    <!-- External Audio Wind Mic Cable -->
    <path d="M 50 140 C 20 140 10 180 30 230 C 45 260 80 250 100 280" fill="none" stroke="#eab308" stroke-width="3"/>
    <!-- Mic Capsule with Deadcat Wind Muff -->
    <circle cx="108" cy="285" r="16" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <text x="108" y="289" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">MIC</text>

    <!-- Mount Pivot / Prongs -->
    <rect x="145" y="210" width="50" height="25" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="170" cy="222" r="6" fill="#38bdf8"/>
  </g>

  <!-- Technical Specs -->
  <g transform="translate(40, 400)" font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="0" y="0">SENSOR: 1/1.9" HDR SENSOR</text>
    <text x="240" y="0">STABILIZATION: HYPERSMOOTH 6.0</text>
    <text x="470" y="0">AUDIO: STEREO WIND CUT</text>
  </g>
</svg>
