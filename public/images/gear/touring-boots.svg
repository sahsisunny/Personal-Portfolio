<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="boot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="leather-grad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sole-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#boot-bg)" rx="16"/>
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" rx="12"/>

  <!-- Technical Labels -->
  <text x="40" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="2">FOOTWEAR & ANKLE RIG</text>
  <text x="40" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Waterproof Ankle-Support Touring Boots</text>

  <!-- Boot Graphic -->
  <g transform="translate(130, 75)">
    <!-- Main Shin & Ankle Shaft -->
    <path d="M 120 40 
             L 210 40 
             L 205 180 
             L 280 230 
             L 290 270 
             L 50 270 
             L 70 210 
             L 110 170 Z" 
          fill="url(#leather-grad)" stroke="#475569" stroke-width="2.5"/>

    <!-- Reinforced Shin Plate (CE Level 2 TPU) -->
    <path d="M 125 50 L 195 50 L 185 140 L 130 140 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <line x1="135" y1="80" x2="180" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="135" y1="110" x2="180" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Ankle Cup Shield (Malleolus Impact Protector) -->
    <circle cx="150" cy="195" r="22" fill="#0b1120" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="150" cy="195" r="10" fill="#1e293b"/>

    <!-- Toe Box & Gear Shifter Protection Pad -->
    <path d="M 220 230 L 275 230 C 285 240 285 260 275 268 L 210 268 Z" fill="#090d16" stroke="#f97316" stroke-width="2"/>
    <path d="M 235 235 L 265 235 L 260 255 L 230 255 Z" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>

    <!-- Heavy Duty Deep Tread Lugged Sole -->
    <path d="M 40 270 
             L 295 270 
             C 300 275 295 295 285 298 
             L 45 298 
             C 35 295 35 275 40 270 Z" 
          fill="url(#sole-grad)" stroke="#64748b" stroke-width="2"/>

    <!-- Sole Grip Lugs -->
    <g fill="#020617">
      <rect x="55" y="298" width="20" height="10" rx="2"/>
      <rect x="85" y="298" width="20" height="10" rx="2"/>
      <rect x="115" y="298" width="20" height="10" rx="2"/>
      <rect x="165" y="298" width="25" height="10" rx="2"/>
      <rect x="200" y="298" width="25" height="10" rx="2"/>
      <rect x="235" y="298" width="25" height="10" rx="2"/>
      <rect x="268" y="298" width="18" height="8" rx="2"/>
    </g>

    <!-- Waterproof Membrane Tag -->
    <g transform="translate(195, 75)">
      <rect width="45" height="18" rx="4" fill="#0284c7"/>
      <text x="22.5" y="13" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">DRY-TEK</text>
    </g>

    <!-- Quick Micro-Ratchet Buckles -->
    <rect x="85" y="110" width="30" height="12" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <rect x="80" y="160" width="30" height="12" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Footer Specs -->
  <g transform="translate(40, 400)" font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="0" y="0">CERT: CE EN 13634 LEVEL 2</text>
    <text x="250" y="0">PROTECTION: TPU ANKLE + HEEL</text>
    <text x="470" y="0">WEATHER: 100% DRY</text>
  </g>
</svg>
