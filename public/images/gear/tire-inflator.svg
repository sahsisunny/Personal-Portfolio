<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pump-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c1e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#pump-bg)" rx="16"/>
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" rx="12"/>

  <!-- Technical Labels -->
  <text x="40" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#06b6d4" letter-spacing="2">TRAIL REPAIR & RESCUE</text>
  <text x="40" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">12V High-Pressure Digital Tire Inflator & Puncture Kit</text>

  <!-- Tire Pump Graphic -->
  <g transform="translate(170, 85)">
    <!-- Main Pump Body -->
    <rect x="40" y="40" width="160" height="230" rx="16" fill="url(#metal-grad)" stroke="#475569" stroke-width="3"/>

    <!-- Integrated Digital Pressure Gauge Screen -->
    <rect x="65" y="70" width="110" height="60" rx="8" fill="#020617" stroke="#06b6d4" stroke-width="2"/>
    <text x="120" y="105" font-family="monospace" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle">32.0</text>
    <text x="120" y="122" font-family="monospace" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">PSI • TARGET SET</text>

    <!-- Control Buttons -->
    <circle cx="90" cy="160" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="90" y="164" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">-</text>

    <circle cx="150" cy="160" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">+</text>

    <circle cx="120" cy="195" r="15" fill="#f97316"/>
    <path d="M 115 190 L 127 195 L 115 200 Z" fill="#ffffff"/>

    <!-- High-Pressure Air Hose Loop -->
    <path d="M 120 40 C 120 10 240 10 240 70 C 240 130 220 180 230 240" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <!-- Brass Schrader Valve Chuck -->
    <rect x="220" y="240" width="20" height="25" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Emergency LED Worklight on top -->
    <rect x="75" y="32" width="90" height="8" rx="2" fill="#f8fafc"/>

    <!-- Puncture Repair Kit Strips on Side -->
    <g transform="translate(15, 100)">
      <rect width="18" height="90" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
      <rect x="2" y="10" width="14" height="6" fill="#f59e0b"/>
      <rect x="2" y="30" width="14" height="6" fill="#f59e0b"/>
      <rect x="2" y="50" width="14" height="6" fill="#f59e0b"/>
      <rect x="2" y="70" width="14" height="6" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Technical Specs -->
  <g transform="translate(40, 400)" font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="0" y="0">MAX PRESSURE: 150 PSI</text>
    <text x="250" y="0">POWER: 12V DC / BATTERY</text>
    <text x="470" y="0">FLOW: 25L / MINUTE</text>
  </g>
</svg>