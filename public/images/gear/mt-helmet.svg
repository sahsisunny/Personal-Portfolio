<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="helm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shell-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent-stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#helm-bg)" rx="16"/>
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" rx="12"/>

  <!-- Helmet Outer Shell Profile -->
  <g transform="translate(40, 20)">
    <!-- Aerodynamic spoiler shadow -->
    <path d="M 400 240 Q 430 250 420 280 L 360 285 Z" fill="#030712" opacity="0.6"/>

    <!-- Main Aerodynamic Shell -->
    <path d="M 260 70 
             C 140 70 90 150 90 230 
             C 90 290 120 330 180 340 
             L 240 340 
             C 280 345 340 335 390 310 
             C 425 290 435 250 430 200 
             C 420 120 360 70 260 70 Z" 
          fill="url(#shell-grad)" stroke="#475569" stroke-width="3"/>

    <!-- Racing / Safety Hi-Viz Accent Stripe -->
    <path d="M 230 75 
             C 320 80 395 130 405 210 
             L 375 220 
             C 365 155 300 105 215 95 Z" 
          fill="url(#accent-stripe)"/>

    <!-- Chin Guard Section -->
    <path d="M 100 250 
             L 180 330 
             L 260 330 
             L 260 270 
             L 170 250 Z" 
          fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Chin Air Vent Slots -->
    <g fill="#020617" stroke="#f97316" stroke-width="1.5">
      <rect x="135" y="280" width="30" height="6" rx="3"/>
      <rect x="145" y="293" width="28" height="6" rx="3"/>
      <rect x="155" y="306" width="26" height="6" rx="3"/>
    </g>

    <!-- Top Crown Exhaust Scoop -->
    <path d="M 220 85 Q 260 80 300 100 L 285 115 Q 250 100 215 100 Z" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>

    <!-- Dual-Visor System (Pinlock-ready Iridium Shield) -->
    <path d="M 155 160 
             C 240 145 320 155 350 210 
             C 360 230 350 255 320 265 
             L 190 260 
             C 165 250 145 220 145 190 
             Z" 
          fill="url(#visor-grad)" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>

    <!-- Visor Reflection Flare -->
    <path d="M 175 170 C 240 160 290 175 325 210 L 310 220 C 280 185 235 175 175 182 Z" fill="#ffffff" opacity="0.45"/>

    <!-- Visor Pivot Ratchet Mechanism -->
    <circle cx="340" cy="225" r="14" fill="#0f172a" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="340" cy="225" r="6" fill="#f97316"/>

    <!-- Internal Sun Visor Drop-down Lever -->
    <rect x="365" y="245" width="14" height="7" rx="2" fill="#e2e8f0"/>

    <!-- ECE 22.06 / DOT Certification Badge -->
    <g transform="translate(370, 275)">
      <rect width="45" height="18" rx="4" fill="#020617" stroke="#22c55e" stroke-width="1.5"/>
      <text x="22.5" y="13" font-family="monospace" font-size="9" font-weight="bold" fill="#22c55e" text-anchor="middle">ECE 22.06</text>
    </g>
  </g>

  <!-- Technical Overlay Labels -->
  <text x="40" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#f97316" letter-spacing="2">HEAD PROTECTION RIG</text>
  <text x="40" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">MT Dual-Visor DOT/ECE Touring Helmet</text>

  <g transform="translate(40, 395)" font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="0" y="0">OPTICS: PINLOCK 70 MAX VISION</text>
    <text x="250" y="0">SHELL: INJECTED THERMOPLASTIC</text>
    <text x="470" y="0">WEIGHT: 1,450G</text>
  </g>
</svg>
