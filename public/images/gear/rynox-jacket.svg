<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#18181B" rx="12" />
  <g transform="translate(200, 150)">
    <!-- Main Jacket Body (Dark Technical Cordura Fabric) -->
    <path d="M -50 -90 L -25 -100 L 25 -100 L 50 -90 L 75 -60 L 60 80 L -60 80 L -75 -60 Z" fill="#27272A" stroke="#3F3F46" stroke-width="3" />
    
    <!-- Shoulders & CE Level 2 Armoured Plates -->
    <path d="M -50 -90 L -95 -20 L -65 -10 L -45 -60 Z" fill="#3F3F46" stroke="#52525B" stroke-width="2" />
    <path d="M 50 -90 L 95 -20 L 65 -10 L 45 -60 Z" fill="#3F3F46" stroke="#52525B" stroke-width="2" />
    
    <!-- High-Vis Neon Orange Accent Panels -->
    <polygon points="-35,-50 -10,-50 -15,20 -40,20" fill="#EA580C" opacity="0.9" />
    <polygon points="35,-50 10,-50 15,20 40,20" fill="#EA580C" opacity="0.9" />
    
    <!-- Heavy-Duty YKK Central Zipper -->
    <line x1="0" y1="-100" x2="0" y2="80" stroke="#71717A" stroke-width="3" stroke-dasharray="4 2" />
    <rect x="-4" y="-30" width="8" height="12" rx="2" fill="#D4D4D8" />
    
    <!-- Chest Pockets & Ventilation Meshes -->
    <rect x="-45" y="-30" width="25" height="30" rx="3" fill="#18181B" stroke="#52525B" stroke-width="1.5" />
    <rect x="20" y="-30" width="25" height="30" rx="3" fill="#18181B" stroke="#52525B" stroke-width="1.5" />

    <!-- Reflective 3M Strips -->
    <line x1="-55" y1="50" x2="-20" y2="50" stroke="#E2E8F0" stroke-width="3" />
    <line x1="20" y1="50" x2="55" y2="50" stroke="#E2E8F0" stroke-width="3" />
  </g>
  <text x="200" y="275" fill="#FB923C" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">RYNOX TORNADO PRO • CE LEVEL 2</text>
</svg>
