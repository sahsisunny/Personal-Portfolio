<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-mcp" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="50%" stop-color="#14112e"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>

    <linearGradient id="mcp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181a38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1227" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="mcp-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="mcp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e2b58" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-mcp)"/>
  <rect width="1200" height="675" fill="url(#mcp-grid)"/>

  <!-- Glows -->
  <circle cx="220" cy="220" r="190" fill="#a855f7" fill-opacity="0.12" filter="url(#mcp-blur)"/>
  <circle cx="980" cy="460" r="220" fill="#06b6d4" fill-opacity="0.1" filter="url(#mcp-blur)"/>

  <!-- Top Banner -->
  <g transform="translate(60, 48)">
    <rect width="1080" height="88" rx="16" fill="#151736" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <rect x="24" y="24" width="115" height="32" rx="8" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1"/>
    <text x="81" y="45" fill="#a5b4fc" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">MCP PROTOCOL</text>

    <text x="160" y="46" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">ASI Genie MCP: Read-Only Tool Server for Claude &amp; Cursor</text>
    <text x="160" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">OAuth at Edge • 120s Ephemeral Delegated JWTs • Invariant Property Injection • Zero Prompt Trust</text>
    
    <rect x="940" y="24" width="115" height="32" rx="8" fill="#7c3aed" fill-opacity="0.25" stroke="#c084fc" stroke-width="1"/>
    <text x="997" y="45" fill="#c084fc" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="700" text-anchor="middle">SSE TRANSPORT</text>
  </g>

  <!-- Left: External AI Clients (Bring their own models & system prompts) -->
  <g transform="translate(60, 160)">
    <rect width="260" height="465" rx="16" fill="url(#mcp-card)" stroke="#312e81" stroke-width="1.5"/>
    <text x="24" y="38" fill="#c084fc" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" letter-spacing="1">EXTERNAL AI CLIENTS</text>

    <!-- Client Box 1: Claude Code -->
    <rect x="20" y="60" width="220" height="85" rx="12" fill="#10132b" stroke="#3730a3" stroke-width="1"/>
    <text x="32" y="88" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Claude Code (CLI)</text>
    <text x="32" y="110" fill="#a5b4fc" font-family="monospace" font-size="11">Native remote MCP client</text>
    <text x="32" y="125" fill="#64748b" font-family="monospace" font-size="10">Runs staff audit prompts</text>

    <!-- Client Box 2: Cursor IDE -->
    <rect x="20" y="160" width="220" height="85" rx="12" fill="#10132b" stroke="#3730a3" stroke-width="1"/>
    <text x="32" y="188" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Cursor IDE</text>
    <text x="32" y="210" fill="#a5b4fc" font-family="monospace" font-size="11">Agent / Composer MCP</text>
    <text x="32" y="225" fill="#64748b" font-family="monospace" font-size="10">External Reasoning Model</text>

    <!-- Client Box 3: Claude Desktop -->
    <rect x="20" y="260" width="220" height="85" rx="12" fill="#10132b" stroke="#3730a3" stroke-width="1"/>
    <text x="32" y="288" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Claude Desktop / Web</text>
    <text x="32" y="310" fill="#a5b4fc" font-family="monospace" font-size="11">SSE Transport Protocol</text>
    <text x="32" y="325" fill="#64748b" font-family="monospace" font-size="10">Host AI reasoning runtime</text>

    <!-- Warning / Invariant Box -->
    <rect x="20" y="360" width="220" height="85" rx="12" fill="#2d1537" stroke="#f43f5e" stroke-width="1"/>
    <text x="32" y="385" fill="#fda4af" font-family="monospace" font-size="11" font-weight="700">EXTERNAL BOUNDARY</text>
    <text x="32" y="405" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">Model is not ours.</text>
    <text x="32" y="422" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">System prompts cannot be trusted.</text>
  </g>

  <!-- Center: ASI Genie MCP Tool Server & OAuth Edge -->
  <g transform="translate(350, 160)">
    <rect width="500" height="465" rx="16" fill="url(#mcp-card)" stroke="#818cf8" stroke-width="2"/>
    
    <rect x="24" y="20" width="452" height="40" rx="8" fill="#1f224f" stroke="#818cf8" stroke-width="1"/>
    <text x="40" y="45" fill="#c7d2fe" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="700" letter-spacing="1">ASI GENIE MCP TOOL SERVER (GO)</text>
    <text x="415" y="44" fill="#a5b4fc" font-family="monospace" font-size="11">SSE / POST</text>

    <!-- Step 1: OAuth Edge Guard -->
    <rect x="24" y="75" width="452" height="85" rx="10" fill="#101432" stroke="#4338ca" stroke-width="1"/>
    <text x="40" y="100" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. OAuth 2.0 Consent &amp; Ephemeral JWT Exchange</text>
    <text x="40" y="122" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Client holds opaque grant. Edge proxy mints internal 120-second JWT.</text>
    <text x="40" y="140" fill="#38bdf8" font-family="monospace" font-size="11">Short-lived (120s) • Bound to user identity + property</text>

    <!-- Step 2: Property Injection Guardrail -->
    <rect x="24" y="170" width="452" height="90" rx="10" fill="#101432" stroke="#4338ca" stroke-width="1"/>
    <text x="40" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Mandatory Property Scope Injection</text>
    <text x="40" y="217" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">External model never chooses hotel ID. Tool server injects verified ID.</text>
    <text x="40" y="238" fill="#34d399" font-family="monospace" font-size="11">Overrides tool params with JWT.PropertyId • Blocks Cross-Tenant Leaks</text>

    <!-- Step 3: Read-Only Parity Tool Filter -->
    <rect x="24" y="270" width="452" height="90" rx="10" fill="#101432" stroke="#4338ca" stroke-width="1"/>
    <text x="40" y="295" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Parity-Filtered Read-Only Tools</text>
    <text x="40" y="317" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Only non-destructive query tools exposed. Mutation APIs strictly blocked.</text>
    
    <rect x="40" y="328" width="125" height="24" rx="6" fill="#1e1b4b"/>
    <text x="102" y="344" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">get_reservations</text>

    <rect x="175" y="328" width="125" height="24" rx="6" fill="#1e1b4b"/>
    <text x="237" y="344" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">query_guest_folio</text>

    <rect x="310" y="328" width="140" height="24" rx="6" fill="#1e1b4b"/>
    <text x="380" y="344" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">get_daily_occupancy</text>

    <!-- Step 4: Output Shape -->
    <rect x="24" y="370" width="452" height="80" rx="10" fill="#111c38" stroke="#0ea5e9" stroke-width="1"/>
    <text x="40" y="395" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. JSON Passthrough &amp; SSE Event Stream</text>
    <text x="40" y="416" fill="#cbd5e1" font-family="monospace" font-size="11">No planner, no UI chip wrappers. Pure standardized MCP tool response.</text>
    <text x="40" y="433" fill="#94a3b8" font-family="monospace" font-size="10">Audited with client IP, token fingerprint, and response byte count</text>
  </g>

  <!-- Right: PMS Downstream Endpoints -->
  <g transform="translate(880, 160)">
    <rect width="260" height="465" rx="16" fill="url(#mcp-card)" stroke="#312e81" stroke-width="1.5"/>
    <text x="24" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" letter-spacing="1">HOTEL PMS BACKEND</text>

    <!-- Box 1 -->
    <rect x="20" y="60" width="220" height="85" rx="10" fill="#10132b" stroke="#1e1b4b" stroke-width="1"/>
    <text x="32" y="88" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Reservation Service</text>
    <text x="32" y="110" fill="#94a3b8" font-family="monospace" font-size="10">Reads in-house guests</text>
    <text x="32" y="125" fill="#38bdf8" font-family="monospace" font-size="10">Checks user RBAC claims</text>

    <!-- Box 2 -->
    <rect x="20" y="160" width="220" height="85" rx="10" fill="#10132b" stroke="#1e1b4b" stroke-width="1"/>
    <text x="32" y="188" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ledger &amp; Folio Service</text>
    <text x="32" y="210" fill="#94a3b8" font-family="monospace" font-size="10">Reads line items &amp; taxes</text>
    <text x="32" y="225" fill="#38bdf8" font-family="monospace" font-size="10">PCI redacted</text>

    <!-- Summary Box -->
    <rect x="20" y="260" width="220" height="185" rx="12" fill="#181135" stroke="#a855f7" stroke-width="1"/>
    <text x="32" y="288" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="700">SECURITY POSTURE</text>
    <text x="32" y="315" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ Zero Browser JWT Leakage</text>
    <text x="32" y="337" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ Invariant 120s TTL</text>
    <text x="32" y="359" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ No Tool Hallucination</text>
    <text x="32" y="381" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ Strict Read-Only Policy</text>
    <text x="32" y="403" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ Complete Audit Trail</text>
    <text x="32" y="426" fill="#a5b4fc" font-family="monospace" font-size="10">Sunny Sahsi • MCP Architecture</text>
  </g>

  <!-- Connectors -->
  <path d="M 320 240 L 350 240" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 850 240 L 880 240" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
