<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-asi" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05131e"/>
      <stop offset="45%" stop-color="#062d29"/>
      <stop offset="100%" stop-color="#021512"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2b2b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071b1b" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#134e4a" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-asi)"/>
  <rect width="1200" height="675" fill="url(#grid-pattern)"/>

  <!-- Subtle glow orbs -->
  <circle cx="200" cy="150" r="180" fill="#0284c7" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="500" r="220" fill="#10b981" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Top Banner / Category Badge -->
  <g transform="translate(60, 48)">
    <rect width="1080" height="88" rx="16" fill="#0b2424" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <rect x="24" y="24" width="100" height="32" rx="8" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-width="1"/>
    <text x="74" y="45" fill="#2dd4bf" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">SYSTEM ARCHITECTURE</text>

    <text x="144" y="46" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Inside ASI Genie: Multi-Tenant AI Orchestration &amp; Zero-Trust Access</text>
    <text x="144" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Go AI Layer • OpenAPI Dynamic Tool Registry • Revocable Delegated Grants • Hotel PMS</text>
    
    <rect x="940" y="24" width="115" height="32" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="997" y="45" fill="#38bdf8" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="700" text-anchor="middle">GO + POSTGRES</text>
  </g>

  <!-- Left Column: Staff UI & Automation Clients -->
  <g transform="translate(60, 160)">
    <rect width="250" height="465" rx="16" fill="url(#card-grad)" stroke="#1e3a3a" stroke-width="1.5"/>
    <text x="24" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" letter-spacing="1">CLIENT &amp; RUNTIME LAYER</text>

    <!-- Client 1: Web UI -->
    <rect x="20" y="60" width="210" height="90" rx="12" fill="#0a1d1d" stroke="#134e4a" stroke-width="1"/>
    <circle cx="42" cy="85" r="10" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="60" y="90" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Hotel Staff UI</text>
    <text x="24" y="122" fill="#94a3b8" font-family="monospace" font-size="11">JWT Bearer + Property Scope</text>
    <text x="24" y="137" fill="#64748b" font-family="monospace" font-size="10">Browser Session Trust Zone</text>

    <!-- Client 2: Automation Runtime -->
    <rect x="20" y="165" width="210" height="110" rx="12" fill="#0a1d1d" stroke="#134e4a" stroke-width="1"/>
    <circle cx="42" cy="190" r="10" fill="#34d399" fill-opacity="0.2"/>
    <text x="60" y="195" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Routine Runtime</text>
    <text x="24" y="225" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">06:00 AM Briefings &amp; Audits</text>
    <text x="24" y="247" fill="#94a3b8" font-family="monospace" font-size="11">Background Cron Engine</text>
    <text x="24" y="262" fill="#64748b" font-family="monospace" font-size="10">Runs without active login</text>

    <!-- Client 3: Delegated Grant Box -->
    <rect x="20" y="290" width="210" height="150" rx="12" fill="#082424" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="32" y="318" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">DELEGATED GRANT</text>
    <text x="32" y="342" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">1. Opaque refresh token</text>
    <text x="32" y="366" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">2. Scoped to 1 property</text>
    <text x="32" y="390" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">3. Instant revocable grant</text>
    <text x="32" y="416" fill="#6ee7b7" font-family="monospace" font-size="10">Never broad DB access</text>
  </g>

  <!-- Middle Column: Go AI Orchestrator Core -->
  <g transform="translate(340, 160)">
    <rect width="520" height="465" rx="16" fill="url(#card-grad)" stroke="#14b8a6" stroke-width="2"/>
    
    <rect x="24" y="20" width="472" height="40" rx="8" fill="#093131" stroke="#14b8a6" stroke-width="1"/>
    <text x="40" y="45" fill="#2dd4bf" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="700" letter-spacing="1">ASI GENIE ORCHESTRATOR (GO SERVICE)</text>
    <text x="430" y="44" fill="#a7f3d0" font-family="monospace" font-size="11">PORT :8080</text>

    <!-- Subsystem 1: Security & Auth Gate -->
    <rect x="24" y="75" width="472" height="75" rx="10" fill="#061e1e" stroke="#0d9488" stroke-width="1"/>
    <text x="40" y="100" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Zero-Trust Property &amp; RBAC Gate</text>
    <text x="40" y="122" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Binds propertyId from authenticated session — never trusts LLM arguments.</text>
    <text x="40" y="138" fill="#38bdf8" font-family="monospace" font-size="11">property_id = enforce(session.Scope) • Prevents IDOR</text>

    <!-- Subsystem 2: Conversation & Planning Engine -->
    <rect x="24" y="160" width="472" height="110" rx="10" fill="#061e1e" stroke="#0d9488" stroke-width="1"/>
    <text x="40" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Conversation Engine &amp; Tool Planner</text>
    <text x="40" y="207" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Translates staff queries into structured OpenAPI calls without hallucinations.</text>
    
    <rect x="40" y="222" width="130" height="28" rx="6" fill="#134e4a"/>
    <text x="105" y="240" fill="#5eead4" font-family="monospace" font-size="11" text-anchor="middle">OpenAPI Registry</text>

    <rect x="180" y="222" width="130" height="28" rx="6" fill="#134e4a"/>
    <text x="245" y="240" fill="#5eead4" font-family="monospace" font-size="11" text-anchor="middle">Time-Anchor IST</text>

    <rect x="320" y="222" width="160" height="28" rx="6" fill="#134e4a"/>
    <text x="400" y="240" fill="#5eead4" font-family="monospace" font-size="11" text-anchor="middle">Multi-Provider LLM</text>

    <!-- Subsystem 3: Deterministic Tool Executor -->
    <rect x="24" y="280" width="472" height="85" rx="10" fill="#061e1e" stroke="#0d9488" stroke-width="1"/>
    <text x="40" y="305" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Deterministic HTTP Tool Executor</text>
    <text x="40" y="327" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Calls downstream microservices with caller JWT; shapes JSON into UI cards.</text>
    <text x="40" y="347" fill="#34d399" font-family="monospace" font-size="11">JSON Passthrough • No LLM math • Verifiable Ledger</text>

    <!-- Subsystem 4: Postgres Audit & Ledger -->
    <rect x="24" y="375" width="472" height="75" rx="10" fill="#082b2b" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="400" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PostgreSQL Audit &amp; State Store</text>
    <text x="40" y="420" fill="#cbd5e1" font-family="monospace" font-size="11">Tables: routines, routine_runs, conversations, tool_calls, audit_events</text>
    <text x="40" y="437" fill="#94a3b8" font-family="monospace" font-size="10">Full auditability of every automated query and execution step</text>
  </g>

  <!-- Right Column: Downstream Hotel PMS Platform -->
  <g transform="translate(890, 160)">
    <rect width="250" height="465" rx="16" fill="url(#card-grad)" stroke="#1e3a3a" stroke-width="1.5"/>
    <text x="24" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" letter-spacing="1">HOTEL PMS SERVICES</text>

    <!-- Service 1 -->
    <rect x="20" y="60" width="210" height="70" rx="10" fill="#0a1d1d" stroke="#134e4a" stroke-width="1"/>
    <text x="32" y="85" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Reservations API</text>
    <text x="32" y="105" fill="#94a3b8" font-family="monospace" font-size="10">GET /api/v2/reservations</text>
    <text x="32" y="118" fill="#6ee7b7" font-family="monospace" font-size="10">Night Audit Date Filter</text>

    <!-- Service 2 -->
    <rect x="20" y="140" width="210" height="70" rx="10" fill="#0a1d1d" stroke="#134e4a" stroke-width="1"/>
    <text x="32" y="165" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Folios &amp; Billing API</text>
    <text x="32" y="185" fill="#94a3b8" font-family="monospace" font-size="10">GET /api/v2/folios/query</text>
    <text x="32" y="198" fill="#6ee7b7" font-family="monospace" font-size="10">Room charges, ledgers</text>

    <!-- Service 3 -->
    <rect x="20" y="220" width="210" height="70" rx="10" fill="#0a1d1d" stroke="#134e4a" stroke-width="1"/>
    <text x="32" y="245" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Reporting Service</text>
    <text x="32" y="265" fill="#94a3b8" font-family="monospace" font-size="10">GET /api/v1/kpi/occupancy</text>
    <text x="32" y="278" fill="#6ee7b7" font-family="monospace" font-size="10">ADR, RevPAR, Revenue</text>

    <!-- Invariants Summary -->
    <rect x="20" y="300" width="210" height="150" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
    <text x="32" y="325" fill="#4ade80" font-family="monospace" font-size="11" font-weight="700">CORE GUARANTEES</text>
    <text x="32" y="350" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ Zero IDOR Across Properties</text>
    <text x="32" y="372" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ No Raw DB SQL Exposed</text>
    <text x="32" y="394" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ Revocable Delegated Tokens</text>
    <text x="32" y="416" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">✓ Deterministic p95 Latency</text>
    <text x="32" y="436" fill="#a7f3d0" font-family="monospace" font-size="10">Sunny Sahsi • Architecture</text>
  </g>

  <!-- Connecting Arrows / Flow lines -->
  <path d="M 310 240 L 340 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 860 240 L 890 240" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
