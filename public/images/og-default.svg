<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <linearGradient id="og-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="og-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="og-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1f2937" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>

  <!-- Glows -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" fill-opacity="0.15" filter="url(#og-blur)"/>
  <circle cx="1000" cy="450" r="200" fill="#6366f1" fill-opacity="0.12" filter="url(#og-blur)"/>
  <circle cx="600" cy="300" r="140" fill="#10b981" fill-opacity="0.08" filter="url(#og-blur)"/>

  <!-- Outer Card Frame -->
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Status Badge -->
  <g transform="translate(90, 95)">
    <rect width="170" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#34d399"/>
    <text x="36" y="22" fill="#34d399" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700">AVAILABLE FOR ROLES</text>
  </g>

  <g transform="translate(280, 95)">
    <rect width="140" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="70" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="700" text-anchor="middle">PATNA, INDIA</text>
  </g>

  <!-- Main Hero Text -->
  <text x="90" y="210" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Sunny Sahsi</text>
  <text x="90" y="260" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700">Associate Full Stack Developer &amp; Systems Engineer</text>
  
  <text x="90" y="315" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18">
    Building production AI chatbot agents, Go microservices, and high-performance Next.js apps.
  </text>
  <text x="90" y="345" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="16">
    Also an endurance solo motorcyclist exploring high-altitude passes across India.
  </text>

  <!-- Tech Stack Badges -->
  <g transform="translate(90, 395)">
    <!-- Badge 1: Go -->
    <rect x="0" y="0" width="85" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="42" y="24" fill="#f1f5f9" font-family="system-ui, monospace" font-size="13" font-weight="700" text-anchor="middle">Golang</text>

    <!-- Badge 2: Next.js -->
    <rect x="97" y="0" width="95" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="144" y="24" fill="#f1f5f9" font-family="system-ui, monospace" font-size="13" font-weight="700" text-anchor="middle">Next.js</text>

    <!-- Badge 3: TypeScript -->
    <rect x="204" y="0" width="115" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="261" y="24" fill="#f1f5f9" font-family="system-ui, monospace" font-size="13" font-weight="700" text-anchor="middle">TypeScript</text>

    <!-- Badge 4: AI Agents -->
    <rect x="331" y="0" width="115" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="388" y="24" fill="#f1f5f9" font-family="system-ui, monospace" font-size="13" font-weight="700" text-anchor="middle">AI Agents</text>

    <!-- Badge 5: MCP -->
    <rect x="458" y="0" width="135" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="525" y="24" fill="#f1f5f9" font-family="system-ui, monospace" font-size="13" font-weight="700" text-anchor="middle">MCP Protocol</text>

    <!-- Badge 6: PostgreSQL -->
    <rect x="605" y="0" width="115" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="662" y="24" fill="#f1f5f9" font-family="system-ui, monospace" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Bottom Bar -->
  <line x1="90" y1="465" x2="1110" y2="465" stroke="#1e293b" stroke-width="1.5"/>

  <g transform="translate(90, 495)">
    <text x="0" y="20" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700">sunnysahsi.com</text>
    <text x="350" y="20" fill="#94a3b8" font-family="monospace" font-size="13">github.com/sahsisunny</text>
    <text x="650" y="20" fill="#94a3b8" font-family="monospace" font-size="13">linkedin.com/in/sahsisunny</text>
  </g>
</svg>
